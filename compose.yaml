# No authentication: localhost only by default.
# To let the Pi connect over a trusted LAN, set the BIND_ADDR shell variable to the PC's LAN IP.
services:
  api:
    build: ./fastapi-server
    ports: ["${BIND_ADDR:-127.0.0.1}:8000:8000"]
    environment:
      DB_PATH: /app/data/server.db
      MODEL_PATH: /app/models/best.pt
      DETECT_CONF: ${DETECT_CONF:-0.5}
    volumes:
      - api-data:/app/data # named volume: SQLite locking is unreliable on Windows bind mounts
      - ./runs/detect/runs/train/trial_gpu/weights/best.pt:/app/models/best.pt:ro
    restart: unless-stopped

volumes:
  api-data:
